<style>

items:stretch;gap:2px;padding:4px 12px 0;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}.tab{border:0;border-radius:6px 6px 0 0;padding:7px 14px;color:var(--muted);font-size:12px}.tab[aria-selected="true"]{background:var(--bg);color:var(--text);border:1px solid var(--line);border-bottom-color:var(--bg);font-weight:650}.tab-count{opacity:.65;margin-left:7px}.formula{height:37px;display:flex;align-items:center;gap:8px;padding:4px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}.namebox{width:92px;text-align:center;border:1px solid var(--line);border-radius:4px;padding:4px;background:var(--field);font:12px ui-monospace,monospace}.fx{font-style:italic;color:var(--muted);font-weight:700;padding:0 5px}.formula input{flex:1;min-width:0;border:0;background:transparent;padding:5px 2px;outline:none!important}.formula input:focus{box-shadow:inset 0 -2px var(--accent)}.gridwrap{flex:1;min-height:0;overflow:auto;position:relative;outline:none;overscroll-behavior:contain;scrollbar-color:var(--line) var(--bg)}.grid{position:relative;min-width:max-content}.grid-head{position:sticky;top:0;z-index:5;height:34px;display:flex;background:var(--panel2);border-bottom:1px solid var(--line)}.corner{position:sticky;left:0;z-index:8;width:52px;min-width:52px;background:var(--panel2);border-right:1px solid var(--line)}.colhead{height:34px;position:relative;display:flex;align-items:center;border-right:1px solid var(--line);padding:0 25px 0 9px;color:var(--muted);font-size:calc(12px * var(--zoom-scale,1));user-select:none}.colhead .sort{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:calc(100% - 8px);padding:4px 0}.colhead .menu-btn{position:absolute;right:2px;top:3px;width:23px;height:27px;padding:2px;color:var(--muted)}.colhead.filtered .menu-btn{color:var(--accent)}.resize{position:absolute;right:-3px;top:0;width:7px;height:100%;z-index:3;cursor:col-resize}.resize:hover,.resize.dragging{background:var(--accent);opacity:.6}.colhead.dragging{opacity:.45}.colhead.drop-target{box-shadow:inset 3px 0 var(--accent)}.rows{position:relative}.row{height:30px;display:flex;position:absolute;left:0;top:0}.rowhead{position:sticky;left:0;z-index:3;width:52px;min-width:52px;height:30px;display:flex;justify-content:center;align-items:center;background:var(--panel2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;user-select:none}.cell{height:30px;display:block;overflow:hidden;white-space:nowrap;text-overflow:clip;padding:5px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg);user-select:none;outline:none;font-size:calc(13px * var(--zoom-scale,1))}.cell.selected{position:relative;background:var(--sel);box-shadow:inset 0 0 0 2px var(--selborder);z-index:2}.cell.in-range{background:color-mix(in srgb,var(--sel) 60%,var(--bg))}.cell.editing{padding:0;overflow:visible;z-index:6}.cell input{width:100%;height:100%;border:0;background:var(--bg);padding:4px 7px;outline:2px solid var(--selborder)}.rowhead.selected{background:var(--sel);color:var(--text)}.filter-menu{position:fixed;z-index:20;width:278px;max-height:min(500px,80vh);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:12px}.filter-menu h3{font-size:13px;margin:0 0 9px}.filter-menu input[type=search]{width:100%;padding:7px;border:1px solid var(--line);border-radius:5px;background:var(--field);margin-bottom:8px}.menu-actions{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.menu-actions button,.filter-actions button{border:1px solid var(--line);font-size:11px}.value-list{max-height:230px;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 0}.value-option{display:flex;gap:8px;align-items:flex-start;padding:5px;font-size:12px;overflow-wrap:anywhere}.value-option input{margin:2px 0 0;accent-color:var(--accent)}.filter-actions{display:flex;justify-content:space-between;gap:6px;margin-top:10px}.statusbar{height:25px;display:flex;align-items:center;gap:15px;padding:0 10px;border-top:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px;flex:none}.statusbar .status{margin-right:auto}.status.error{color:var(--danger)}.hidden-note{color:var(--accent)}.zoom{width:120px;accent-color:var(--accent)}.toast{position:fixed;bottom:38px;left:50%;transform:translateX(-50%);z-index:30;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;box-shadow:var(--shadow)}.modal-backdrop{position:fixed;inset:0;background:#0008;z-index:40;display:grid;place-items:center}.modal{width:min(480px,calc(100vw - 30px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}.modal h2{margin:0 0 10px;font-size:17px}.modal p{color:var(--muted);margin:0 0 16px}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.modal-actions button:last-child{background:var(--accent);color:#071421}.hidden{display:none!important}.help{font-size:11px;color:var(--muted)}@media(max-width:700px){.titlebar{gap:6px;padding:0 7px}.toolrow{padding:4px}.formula{padding:4px 6px}.namebox{width:70px}.app-name{font-size:13px}.save-state{display:none}}
</style>
</head>
<body>
<header class="titlebar"><span class="app-name">Leitor CSV</span><span class="docname" id="docname">Nenhum arquivo aberto</span><span class="save-state" id="saveState">Abra um ou mais arquivos CSV para começar.</span><span class="spacer"></span><button id="undo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer">↶</button><button id="redo" title="Refazer (Ctrl+Y)" aria-label="Refazer">↷</button><button id="theme" title="Alternar tema">☀</button></header>
<nav class="toolrow" aria-label="Ferramentas"><button id="newRow" title="Inserir linha abaixo (Ctrl+Alt+=)"><span class="ico">＋</span>Linha</button><button id="deleteRow" title="Excluir linha selecionada"><span class="ico">−</span>Linha</button><span class="sep"></span><button id="newCol" title="Inserir coluna à direita"><span class="ico">＋</span>Coluna</button><button id="hideCol" title="Ocultar coluna selecionada">Ocultar coluna</button><button id="showCols" title="Mostrar todas as colunas">Mostrar colunas</button><span class="sep"></span><button id="find" title="Localizar (Ctrl+F)">⌕ Localizar</button><button id="browseFolder" title="Abrir arquivos CSV de uma pasta">Carregar pasta</button><button id="export" title="Baixar CSV ativo">⇩ Baixar CSV</button><button id="openFiles" class="file-open">Abrir CSVs<input id="fileInput" type="file" accept=".csv,text/csv" multiple></button><span class="sep"></span><span class="help">Duplo clique ou F2 edita · Ctrl+C/V copia/cola · setas navegam</span></nav>
<nav class="tabs" id="tabs" role="tablist" aria-label="Arquivos CSV"></nav>
<div class="formula"><input class="namebox" id="cellName" aria-label="Referência da célula" value="A1"><span class="fx">fx</span><input id="cellValue" aria-label="Conteúdo da célula" placeholder="Selecione uma célula para ver ou editar seu conteúdo"></div>
<main id="gridwrap" class="gridwrap" tabindex="0" aria-label="Tabela CSV. Use as setas para navegar entre células."><div id="grid" class="grid"><div id="gridHead" class="grid-head"></div><div id="rows" class="rows"></div></div></main>
<footer class="statusbar"><span class="status" id="status">Abra CSV para começar.</span><span id="selectionInfo"></span><span id="hiddenInfo" class="hidden-note"></span><label>Zoom <input id="zoom" class="zoom" type="range" min="70" max="140" value="100"></label><span id="zoomLabel">100%</span></footer>
<div id="popup"></div><div id="modalRoot"></div>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id),ui=Object.fromEntries(['docname','saveState','undo','redo','theme','newRow','deleteRow','newCol','hideCol','showCols','find','browseFolder','export','fileInput','tabs','cellName','cellValue','gridwrap','grid','gridHead','rows','status','selectionInfo','hiddenInfo','zoom','zoomLabel','popup','modalRoot'].map(x=>[x,$(x)]));
const sheets=new Map(),ROW_H=30,ROWNUM=52,BUFFER=10,HISTORY=100;let current=null,view=[],selected={r:0,c:0},range=null,sort=null,filters=new Map(),hidden=new Set(),widths=[],history=[],future=[],dirty=false,raf=0,searchTimer=0,zoom=100,editing=false,menuCol=-1,dragColumn=-1,storageScope=location.pathname,persistentEdits=true;
const collator=new Intl.Collator('pt-BR',{numeric:true,sensitivity:'base'}),norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR');
function detectDelimiter(text){text=text.replace(/^\uFEFF/,'');const candidates=[',',';','\t','|'],samples=Object.fromEntries(candidates.map(d=>[d,[]])),counts=Object.fromEntries(candidates.map(d=>[d,0]));let quoted=false,records=0;for(let i=0;i<text.length&&records<8;i++){const ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){i++;continue}quoted=!quoted;continue}if(!quoted&&candidates.includes(ch)){counts[ch]++;continue}if(!quoted&&(ch==='\r'||ch==='\n')){if(ch==='\r'&&text[i+1]==='\n')i++;for(const d of candidates){samples[d].push(counts[d]);counts[d]=0}records++}}if(records<8&&Object.values(counts).some(Boolean))for(const d of candidates)samples[d].push(counts[d]);let best=',',bestScore=[-1,-1,-1,-1];for(const d of candidates){const values=samples[d],freq=new Map();for(const n of values)freq.set(n,(freq.get(n)||0)+1);const score=[values.filter(n=>n>0).length,Math.max(0,...freq.values()),Math.max(0,...values),values.reduce((a,b)=>a+b,0)];if(score.some((n,i)=>n>bestScore[i]&&score.slice(0,i).every((v,j)=>v===bestScore[j]))){best=d;bestScore=score}}return best}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const delimiter=detectDelimiter(text);let rows=[],row=[],field='',quoted=false,after=false;for(let i=0;i<text.length;i++){let ch=text[i];if(quoted){if(ch==='"'){if(text[i+1]==='"'){field+='"';i++}else{quoted=false;after=true}}else field+=ch;continue}if(after&&ch!==delimiter&&ch!=='\r'&&ch!=='\n')throw Error('Caractere após aspas na linha '+(rows.length+1));if(ch==='"'){if(field)throw Error('Aspas inválidas na linha '+(rows.length+1));quoted=true}else if(ch===delimiter){row.push(field);field='';after=false}else if(ch==='\r'||ch==='\n'){row.push(field);field='';after=false;if(!(row.length===1&&!row[0]))rows.push(row);row=[];if(ch==='\r'&&text[i+1]==='\n')i++}else field+=ch}if(quoted)throw Error('Campo entre aspas não fechado');if(field||row.length){row.push(field);rows.push(row)}if(!rows.length)throw Error('CSV vazio');let headers=rows.shift();if(headers.some(x=>!x)||new Set(headers).size!==headers.length)throw Error('Cabeçalho vazio ou duplicado');for(let i=0;i<rows.length;i++)if(rows[i].length!==headers.length)throw Error(`Linha ${i+2}: número de colunas inválido`);return {headers,rows,delimiter}}
function serializeCSV(s){const delimiter=s.delimiter||',';return [s.headers,...s.rows].map(row=>row.map(v=>{v=String(v??'');return v.includes(delimiter)||/["\r\n]/.test(v)?'"'+v.replaceAll('"','""')+'"':v}).join(delimiter)).join('\r\n')+'\r\n'}
function safeName(n){return n.replace(/\.csv$/i,'').replace(/[_-]+/g,' ').replace(/\b\w/g,x=>x.toUpperCase())}
function fingerprint(s){let h=0x811c9dc5,txt=JSON.stringify([s.headers,s.rows]);for(let i=0;i<txt.length;i++){h^=txt.charCodeAt(i);h=Math.imul(h,0x01000193)}return(h>>>0).toString(16)}
function stateKey(n,s){return 'csv-viewer-sheet:'+encodeURIComponent(storageScope)+'|'+encodeURIComponent(n)+'|'+s.originHash}
function loadSaved(name,s){s.originHash=fingerprint(s);if(!persistentEdits)return s;try{let saved=localStorage.getItem(stateKey(name,s));if(!saved)return s;let v=JSON.parse(saved);if(Array.isArray(v.headers)&&Array.isArray(v.rows)&&v.rows.every(r=>Array.isArray(r)&&r.length===v.headers.length)){s.headers=v.headers;s.rows=v.rows;s.hidden=Array.isArray(v.hidden)?v.hidden:[];s.widths=Array.isArray(v.widths)?v.widths:undefined;s.saved=true}}catch{}return s}
function store(){const s=sheets.get(current);s.hidden=[...hidden];s.widths=widths;if(!persistentEdits){dirty=true;ui.saveState.textContent='Alterações nesta sessão · baixe CSV para salvar';ui.saveState.className='save-state error';updateStatus();return}try{localStorage.setItem(stateKey(current,s),JSON.stringify({headers:s.headers,rows:s.rows,hidden:s.hidden,widths:s.widths}));s.saved=true;dirty=false;ui.saveState.textContent='Alterações salvas neste navegador';ui.saveState.className='save-state'}catch{dirty=true;ui.saveState.textContent='Alterações só nesta sessão · baixe CSV para salvar';ui.saveState.className='save-state error'}updateStatus()}
function changed(action){history.push(action);if(history.length>HISTORY)history.shift();future=[];dirty=true;ui.saveState.textContent='Alterações não baixadas';ui.saveState.className='save-state dirty';store();render();updateFormula();}
function tabs(){ui.tabs.replaceChildren();for(const [name,s] of sheets){const b=document.createElement('button');b.className='tab';b.type='button';b.role='tab';b.setAttribute('aria-selected',String(name===current));b.textContent=s.label||safeName(name);const n=document.createElement('span');n.className='tab-count';n.textContent=s.rows.length.toLocaleString('pt-BR');b.append(n);b.addEventListener('click',()=>activate(name));ui.tabs.append(b)}}
function activate(name){current=name;const s=sheets.get(name);s.label=s.label||safeName(name);sort=null;filters=new Map();hidden=new Set(s.hidden||[]);widths=s.widths||s.headers.map(()=>170);selected={r:0,c:0};range=null;history=[];future=[];dirty=false;ui.docname.textContent=s.label;ui.saveState.textContent=s.saved?'Alterações salvas neste navegador':'CSV original';ui.saveState.className='save-state';tabs();rebuildHead();applyView();ui.gridwrap.focus();}
function visibleCols(){return sheets.get(current).headers.map((_,i)=>i).filter(i=>!hidden.has(i))}
function rebuildHead(){const s=sheets.get(current),cols=visibleCols();ui.grid.style.setProperty('--rownum',ROWNUM+'px');ui.gridHead.replaceChildren();let corner=document.createElement('div');corner.className='corner';corner.title='Selecionar tudo';corner.textContent='';corner.addEventListener('click',()=>{range={r1:0,c1:0,r2:s.rows.length-1,c2:s.headers.length-1};render()});ui.gridHead.append(corner);for(const c of cols){const h=document.createElement('div');h.className='colhead'+(filters.has(c)?' filtered':'');h.style.width=(widths[c]||170)+'px';h.draggable=true;h.addEventListener('dragstart',e=>{if(e.target.classList.contains('resize')){e.preventDefault();return}dragColumn=c;h.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(c))});h.addEventListener('dragend',()=>{dragColumn=-1;ui.gridHead.querySelectorAll('.drop-target,.dragging').forEach(x=>x.classList.remove('drop-target','dragging'))});h.addEventListener('dragover',e=>{if(dragColumn>=0&&dragColumn!==c){e.preventDefault();e.dataTransfer.dropEffect='move';h.classList.add('drop-target')}});h.addEventListener('dragleave',()=>h.classList.remove('drop-target'));h.addEventListener('drop',e=>{e.preventDefault();h.classList.remove('drop-target');if(dragColumn>=0&&dragColumn!==c)moveColumn(dragColumn,c)});const name=document.createElement('button');name.className='sort';name.type='button';name.textContent=s.headers[c];name.title=s.headers[c]+' · arraste para mover · clique para ordenar';if(sort?.c===c)name.textContent+=' '+(sort.dir===1?'↑':'↓');name.addEventListener('click',()=>{sort={c,dir:sort?.c===c?-sort.dir:1};rebuildHead();applyView()});const mb=document.createElement('button');mb.type='button';mb.className='menu-btn';mb.textContent=filters.has(c)?'▼':'⋮';mb.title='Filtrar e ordenar '+s.headers[c];mb.addEventListener('click',e=>{e.stopPropagation();openFilter(c,mb)});const rz=document.createElement('div');rz.className='resize';rz.title='Arraste para redimensionar';rz.addEventListener('pointerdown',e=>resizeStart(e,c));h.append(name,mb,rz);ui.gridHead.append(h)}}
function applyView(){const s=sheets.get(current);view=s.rows.map((_,i)=>i).filter(r=>{for(const [c,f]of filters){let v=String(s.rows[r][c]??'');if(f.search&&!norm(v).includes(norm(f.search)))return false;if(f.values&&!f.values.has(v))return false;if(f.empty==='yes'&&v.trim())return false;if(f.empty==='no'&&!v.trim())return false}return true});if(sort)view.sort((a,b)=>sort.dir*collator.compare(s.rows[a][sort.c]??'',s.rows[b][sort.c]??'')||a-b);ui.gridwrap.scrollTop=0;ui.gridwrap.scrollLeft=0;ui.rows.style.height=(view.length*ROW_H)+'px';render();updateStatus();updateFormula()}
function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{if(!current)return;const s=sheets.get(current),cols=visibleCols(),start=Math.max(0,Math.floor(ui.gridwrap.scrollTop/ROW_H)-BUFFER),count=Math.ceil(ui.gridwrap.clientHeight/ROW_H)+BUFFER*2,end=Math.min(view.length,start+count),frag=document.createDocumentFragment();ui.rows.replaceChildren();for(let vi=start;vi<end;vi++){const ri=view[vi],row=document.createElement('div');row.className='row';row.style.transform=`translateY(${vi*ROW_H}px)`;const rh=document.createElement('div');rh.className='rowhead'+(range&&ri>=Math.min(range.r1,range.r2)&&ri<=Math.max(range.r1,range.r2)?' selected':'');rh.textContent=(ri+1).toLocaleString('pt-BR');rh.addEventListener('click',e=>{if(e.shiftKey)range={r1:0,c1:selected.c,r2:ri,c2:selected.c};else{selected={r:ri,c:selected.c};range={r1:ri,c1:0,r2:ri,c2:s.headers.length-1}}render();updateFormula()});row.append(rh);for(const ci of cols){const cell=document.createElement('div');cell.className='cell';cell.style.width=(widths[ci]||170)+'px';cell.dataset.r=ri;cell.dataset.c=ci;cell.textContent=s.rows[ri][ci]??'';cell.title=s.rows[ri][ci]??'';if(selected.r===ri&&selected.c===ci)cell.classList.add('selected');if(range&&inside(range,ri,ci))cell.classList.add('in-range');cell.addEventListener('click',e=>selectCell(ri,ci,e.shiftKey));cell.addEventListener('dblclick',()=>editCell(ri,ci));cell.addEventListener('contextmenu',e=>{e.preventDefault();selectCell(ri,ci,false);openCellMenu(e.clientX,e.clientY)});row.append(cell)}frag.append(row)}ui.rows.append(frag)})}
function inside(g,r,c){return r>=Math.min(g.r1,g.r2)&&r<=Math.max(g.r1,g.r2)&&c>=Math.min(g.c1,g.c2)&&c<=Math.max(g.c1,g.c2)}
function selectCell(r,c,shift){if(shift)range={r1:selected.r,c1:selected.c,r2:r,c2:c};else{selected={r,c};range=null}render();updateFormula();ui.gridwrap.focus({preventScroll:true})}
function updateFormula(){if(!current)return;const s=sheets.get(current),col=selected.c;ui.cellName.value=colName(col)+(selected.r+1);ui.cellValue.value=s.rows[selected.r]?.[col]??'';const count=range?((Math.abs(range.r2-range.r1)+1)*(Math.abs(range.c2-range.c1)+1)):1;ui.selectionInfo.textContent=count>1?`${count} células selecionadas`:''}
function updateStatus(){if(!current)return;const s=sheets.get(current);ui.status.textContent=`${view.length.toLocaleString('pt-BR')} de ${s.rows.length.toLocaleString('pt-BR')} linhas · ${visibleCols().length} de ${s.headers.length} colunas`;ui.hiddenInfo.textContent=hidden.size?`${hidden.size} coluna(s) oculta(s)`:'';ui.status.className='status'}
function colName(n){let out='';for(n++;n;n=Math.floor((n-1)/26))out=String.fromCharCode(65+(n-1)%26)+out;return out}
function resizeStart(e,c){e.preventDefault();e.stopPropagation();const startX=e.clientX,startW=widths[c]||170,handle=e.currentTarget,head=handle.parentElement;handle.classList.add('dragging');function move(ev){widths[c]=Math.max(55,Math.min(800,startW+(ev.clientX-startX)));head.style.width=widths[c]+'px';for(const el of ui.rows.querySelectorAll(`.cell[data-c="${c}"]`))el.style.width=widths[c]+'px'}function done(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',done);handle.classList.remove('dragging');sheets.get(current).widths=widths;saveSettings()}window.addEventListener('pointermove',move);window.addEventListener('pointerup',done,{once:true})}

function findDialog(){if(!current)return;ui.modalRoot.replaceChildren();const bg=document.createElement('div');bg.className='modal-backdrop';const box=document.createElement('div');box.className='modal';const h=document.createElement('h2');h.textContent='Localizar neste CSV';const input=document.createElement('input');input.type='search';input.placeholder='Buscar em todas as células';input.style.cssText='width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--field);margin:0 0 14px';const p=document.createElement('p');p.textContent='A busca ignora acentos e não altera os dados.';const a=document.createElement('div');a.className='modal-actions';const cancel=button('Fechar',()=>bg.remove()),next=button('Localizar próximo',()=>{const s=sheets.get(current),q=norm(input.value);if(!q)return;let found=null;for(let step=1;step<=s.rows.length*s.headers.length;step++){const k=(selected.r*s.headers.length+selected.c+step)%(s.rows.length*s.headers.length),r=Math.floor(k/s.headers.length),c=k%s.headers.length;if(norm(s.rows[r][c]).includes(q)){found={r,c};break}}if(found){selected=found;range=null;sort=null;filters.clear();rebuildHead();applyView();scrollSelectedIntoView();render();updateFormula();bg.remove()}else toast('Nenhuma correspondência encontrada')});a.append(cancel,next);box.append(h,input,p,a);bg.append(box);bg.addEventListener('click',e=>{if(e.target===bg)bg.remove()});ui.modalRoot.append(bg);input.focus();input.addEventListener('keydown',e=>{if(e.key==='Enter')next.click();if(e.key==='Escape')bg.remove()})}
